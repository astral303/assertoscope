name: Release

# A library ships as source through crates.io; `mise run release-execute`
# publishes it and pushes the tag. This workflow gives the tag a GitHub
# release page whose notes are the tag's CHANGELOG.md section, so the
# repository's Releases list shows what each version changed.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.2.0
        required: true

permissions:
  contents: read

jobs:
  # The checks run again on the tagged commit, and the release page is
  # created only when they pass. `cargo release` has published the crate by
  # the time the tag arrives, so a failure here reports a bad release rather
  # than preventing one.
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: ./.github/actions/rust-toolchain
      - run: mise run check-ci

  release:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.TAG }}
      # Only panache, for the release notes, at the version mise.toml pins.
      # mise's own cache stays off, as in the toolchain action
      # (jdx/mise-action#215).
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: github:jolars/panache
          cache: false
      # The tag's CHANGELOG.md section opens the notes; GitHub's generated
      # list of pull requests follows it. Run directly, not through
      # `mise run`, which first installs every tool in mise.toml.
      - name: Write the release notes
        run: scripts/release-notes.sh "$TAG" "$RUNNER_TEMP/release-notes.md"
      # GitHub's generated notes compare against the last release that was
      # not a pre-release. Compared against an `-rc` tag, the release after
      # it would list only the changes since that candidate.
      - name: Find the last stable release
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/${{ github.repository }}/releases" \
            --jq 'map(select(.prerelease == false and .draft == false))
                  | .[0].tag_name // ""')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Comparing against ${tag:-nothing: GitHub will choose}"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.TAG }}
          # A hyphenated tag is a pre-release, which keeps it out of
          # /releases/latest.
          prerelease: ${{ contains(env.TAG, '-') }}
          previous_tag: ${{ steps.baseline.outputs.tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
